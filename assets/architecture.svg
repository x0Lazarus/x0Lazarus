<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Security systems architecture</title><desc id="desc">Three distinct engineering structures: agent orchestration, confidence-triggered escalation to a more capable model, an intelligence graph with controlled C2 blocklist delivery, and a model gateway with GPU/VRAM tuning, memory, and evaluation.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#73b88b"/></marker></defs><rect width="1200" height="390" rx="12" fill="#0b1510"/><rect x="14" y="14" width="380" height="362" rx="9" fill="#0d1912" stroke="#294332"/><text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#79c48f">01</text><text x="63" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#a0e9b0">ORCHESTRATION</text><text x="34" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8ba594">Distinct paths for analysis and comparison</text><rect x="410" y="14" width="380" height="362" rx="9" fill="#0d1912" stroke="#294332"/><text x="430" y="44" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#79c48f">02</text><text x="459" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#a0e9b0">KNOWLEDGE</text><text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8ba594">Relationships anchored to source evidence</text><rect x="806" y="14" width="380" height="362" rx="9" fill="#0d1912" stroke="#294332"/><text x="826" y="44" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#79c48f">03</text><text x="855" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#a0e9b0">RUNTIME</text><text x="826" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8ba594">Model access with memory and feedback</text><rect x="34" y="101" width="110" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="89.0" y="125.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Specialist A</text><rect x="149" y="101" width="110" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="204.0" y="125.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Specialist B</text><rect x="264" y="101" width="110" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="319.0" y="125.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Specialist C</text><path d="M89 139V165H204V186" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M204 139V186" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M319 139V165H204V186" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="109" y="186" width="190" height="40" rx="6" fill="#173224" stroke="#57946a"/><text x="204.0" y="211.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#e0f4e5">Evidence synthesis</text><text x="34" y="259" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#8ba594">ESCALATE WHEN TRIAGE CONFIDENCE IS LOW</text><rect x="34" y="274" width="113" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="90.5" y="298.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Initial triage</text><path d="M147 293H179" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="179" y="274" width="195" height="48" rx="6" fill="#173224" stroke="#57946a"/><text x="276.5" y="293.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#e0f4e5">More capable model</text><text x="276.5" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#b9d2c1">Second opinion</text><text x="34" y="347" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#91b59c">Provenance · contradictions · coverage</text><rect x="430" y="103" width="144" height="36" rx="6" fill="#101e17" stroke="#304b39"/><text x="502.0" y="126.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Source reporting</text><rect x="626" y="103" width="144" height="36" rx="6" fill="#101e17" stroke="#304b39"/><text x="698.0" y="126.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Sightings</text><rect x="507" y="192" width="186" height="42" rx="6" fill="#173224" stroke="#57946a"/><text x="600.0" y="218.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#e0f4e5">Intelligence graph</text><path d="M502 139V158L553 192" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M698 139V158L647 192" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430" y="275" width="104" height="44" rx="6" fill="#101e17" stroke="#304b39"/><text x="482" y="302" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#b9d2c1">Cited answers</text><rect x="548" y="275" width="104" height="44" rx="6" fill="#101e17" stroke="#304b39"/><text x="600" y="293" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#b9d2c1">Exposure</text><text x="600" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#b9d2c1">context</text><rect x="666" y="275" width="104" height="44" rx="6" fill="#101e17" stroke="#304b39"/><text x="718" y="293" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#b9d2c1">C2 blocklist</text><text x="718" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#b9d2c1">delivery</text><path d="M548 234L482 275" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M600 234V275" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M652 234L718 275" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="430" y="347" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#91b59c">Validation · enrichment · detection queries</text><rect x="826" y="101" width="144" height="36" rx="6" fill="#101e17" stroke="#304b39"/><text x="898.0" y="124.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Coding agents</text><rect x="1022" y="101" width="144" height="36" rx="6" fill="#101e17" stroke="#304b39"/><text x="1094.0" y="124.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Project memory</text><path d="M1022 119H970" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/><path d="M898 137V158H996V183" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="897" y="183" width="198" height="40" rx="6" fill="#173224" stroke="#57946a"/><text x="996.0" y="208.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#e0f4e5">Dual-protocol gateway</text><path d="M944 223V248H898V269" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1048 223V248H1094V269" stroke="#73b88b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="826" y="269" width="144" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="898.0" y="293.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Hosted models</text><rect x="1022" y="269" width="144" height="38" rx="6" fill="#101e17" stroke="#304b39"/><text x="1094.0" y="293.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#b9d2c1">Local inference</text><text x="826" y="347" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#91b59c">Cache tuning · model swaps · evaluations</text><text x="826" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#91b59c">GPU / VRAM-aware context allocation</text></svg>